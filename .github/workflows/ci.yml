name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift tests
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test build scripts
        run: |
          bash Tests/ScriptTests/sign_app_tests.sh
          bash Tests/ScriptTests/package_release_tests.sh

      - name: Run Swift tests without WebKit process state
        run: >-
          swift test
          --skip
          '(ExternalDropActivatingWebViewTests|NotionEditorSelectionTests|NotionWebSessionTests|PiPChromeViewTests|PiPPanelGeometryTests|WebNavigationDestinationTests)'

      - name: Run WebKit-dependent suites in isolated processes
        run: |
          suites=(
            ExternalDropActivatingWebViewTests
            NotionEditorSelectionTests
            NotionWebSessionTests
            PiPChromeViewTests
            PiPPanelGeometryTests
            WebNavigationDestinationTests
          )
          for suite in "${suites[@]}"; do
            echo "::group::${suite}"
            swift test --skip-build --filter "${suite}"
            echo "::endgroup::"
          done

      - name: Build release configuration
        if: github.event_name == 'push'
        run: swift build --configuration release
