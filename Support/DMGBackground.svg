<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1c2b3d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Plain white canvas: no gradients, no glass panels. -->
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- Editorial header, left aligned. -->
  <circle cx="43" cy="36" r="4" fill="#1476ff"/>
  <text x="56" y="40"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="10" font-weight="700" letter-spacing="1.8" fill="#8a97a6">
    PERCH FOR MAC
  </text>
  <text x="42" y="73"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif"
        font-size="26" font-weight="650" letter-spacing="-0.35" fill="#17283f">
    Drag Perch to Applications
  </text>

  <!-- Minimal transfer arrow between the two icon wells. -->
  <g transform="translate(320,215)">
    <circle r="19" fill="#ffffff" filter="url(#badgeShadow)"/>
    <path d="M-7 0 H7 M2 -6 L8 0 L2 6"
          fill="none" stroke="#1476ff" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Cute accent doodles, kept out of the icon-drop zones. -->

  <!-- Amber mascot blob, upper gap. -->
  <g transform="translate(282,132)">
    <path d="M18 4 L27 12 L18 15 Z" fill="#f0a84a"/>
    <path d="M0 11 C0 4 6 -1 13 0 C20 1 24 7 22 13 C20 19 12 21 6 19 C1 17 0 14 0 11 Z" fill="#c9803a"/>
    <circle cx="7" cy="9" r="1.5" fill="#5c3d1a"/>
    <circle cx="13" cy="8" r="1.5" fill="#5c3d1a"/>
  </g>

  <!-- Violet mascot blob, lower gap. -->
  <g transform="translate(282,262)">
    <path d="M18 18 L28 11 L20 24 Z" fill="#a78bfa"/>
    <path d="M0 9 C0 3 6 -2 13 0 C20 2 23 8 21 13 C19 19 11 21 5 18 C1 16 0 12 0 9 Z" fill="#8b5cf6"/>
    <circle cx="6" cy="8" r="1.5" fill="#3a2a6d"/>
    <circle cx="12" cy="7" r="1.5" fill="#3a2a6d"/>
  </g>

  <!-- Teal pin doodle, right margin. -->
  <g transform="translate(578,140)">
    <path d="M11 0 C17 0 22 5 22 11 C22 17 11 30 11 30 C11 30 0 17 0 11 C0 5 5 0 11 0 Z" fill="#2bb8a3"/>
    <circle cx="8" cy="10" r="1.4" fill="#0d453d"/>
    <circle cx="14" cy="10" r="1.4" fill="#0d453d"/>
  </g>

  <!-- Blue cursor badge, lower right. -->
  <g transform="translate(572,296)">
    <circle cx="9" cy="9" r="9" fill="#1476ff"/>
    <path d="M5 4 L14 8 L10 10 L8 14 Z" fill="#ffffff"/>
  </g>

  <!-- Coral "drop here" cue above the Applications folder. -->
  <g transform="translate(460,124)">
    <circle r="9" fill="#ff6b6b"/>
    <rect x="-4" y="-1.4" width="8" height="2.8" rx="1.4" fill="#ffffff"/>
    <path d="M-7 12 L7 12 L0 22 Z" fill="#ff6b6b"/>
  </g>

  <!-- Fine perimeter accents. -->
  <circle cx="604" cy="45" r="2.2" fill="#1476ff" fill-opacity="0.55"/>
  <circle cx="613" cy="45" r="1.2" fill="#1476ff" fill-opacity="0.32"/>
  <path d="M14 372 L26 364 L20 380 Z" fill="#f0a84a" fill-opacity="0.65"/>
</svg>
