<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Quick Capture</title>
  <link rel="stylesheet" href="composer.css">
</head>
<body>
  <main id="page" aria-label="Quick Capture editor">
    <header class="page-header">
      <span id="status" role="status" aria-live="polite">Loading…</span>
      <button id="retry" type="button" hidden>Retry</button>
      <button id="new-note" type="button" disabled>New note</button>
    </header>
    <input id="title" aria-label="Note title" autocomplete="off" placeholder="Untitled" disabled>
    <div id="editor"></div>
    <div id="slash-menu" class="editor-overlay" role="listbox" aria-label="Block types" hidden></div>
    <div id="format-toolbar" class="editor-overlay" role="toolbar" aria-label="Formatting" hidden></div>
  </main>
  <script src="editor.js"></script>
</body>
</html>
