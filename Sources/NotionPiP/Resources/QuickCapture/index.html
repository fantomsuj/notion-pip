<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Quick Capture</title>
  <link rel="stylesheet" href="composer.css">
</head>
<body>
  <main id="page" aria-label="Quick Capture editor">
    <header class="page-header">
      <span id="status" role="status" aria-live="polite">Loading…</span>
      <button id="retry" type="button" hidden>Retry</button>
      <button id="new-note" type="button" disabled>New note</button>
    </header>
    <input id="title" aria-label="Note title" autocomplete="off" placeholder="Untitled" disabled>
    <div id="editor"></div>
    <div id="slash-menu" class="editor-overlay" role="listbox" aria-label="Block types" hidden></div>
    <div id="format-toolbar" class="editor-overlay" role="toolbar" aria-label="Formatting" hidden>
      <button type="button" data-command="bold" data-format="bold" aria-label="Bold" aria-pressed="false"><strong>B</strong></button>
      <button type="button" data-command="italic" data-format="italic" aria-label="Italic" aria-pressed="false"><em>I</em></button>
      <button type="button" data-command="underline" data-format="underline" aria-label="Underline" aria-pressed="false"><u>U</u></button>
      <button type="button" data-command="strike" data-format="strike" aria-label="Strikethrough" aria-pressed="false"><s>S</s></button>
      <button type="button" data-command="code" data-format="code" aria-label="Inline code" aria-pressed="false"><code>&lt;/&gt;</code></button>
      <button type="button" data-command="link" data-format="link" aria-label="Link" aria-pressed="false">Link</button>
    </div>
  </main>
  <script src="editor.js"></script>
</body>
</html>
